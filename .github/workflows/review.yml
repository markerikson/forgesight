name: DiffLoupe Review

# Reviews each pull request with the published DiffLoupe CLI. The review job
# runs the model with a read-only token; the post job holds the write token and
# runs no model; the gate job fails while a posted blocker is still open.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# A push makes an in-flight review obsolete: it is reading code that no longer
# exists, and a run costs real money.
concurrency:
  group: diffloupe-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  DIFFLOUPE_VERSION: "0.5.0"
  TILTH_VERSION: "0.9.0"

jobs:
  review:
    # Fork pull requests get no secrets, so the first model call would fail.
    # Bot-authored pull requests are dependency bumps.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No write scope. The model reads the pull request description and diff,
    # which the author wrote; nothing it produces may act on GitHub. The write
    # token lives in the post job, which runs no model.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reviewed: ${{ steps.result.outputs.reviewed }}
      skip-reason: ${{ steps.result.outputs.skip-reason }}
      artifact: ${{ steps.result.outputs.artifact }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      # Outside the workspace, so the review never sees its own output as part
      # of the checkout. Job-level env cannot read the runner context.
      - name: Set up directories
        run: |
          echo "OUT=$RUNNER_TEMP/diffloupe-out" >> "$GITHUB_ENV"
          # Empty data and config dirs: no user config, no stored credentials,
          # and no local runs for a re-review to link to.
          mkdir -p "$RUNNER_TEMP/diffloupe-data" "$RUNNER_TEMP/diffloupe-config"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/diffloupe-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/diffloupe-config" >> "$GITHUB_ENV"

      # The head commit, not the merge commit GitHub synthesizes: line numbers
      # must match the Files Changed tab. Full history for the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The settings come from the base branch, so the pull request cannot
      # rewrite its own review instructions. The default branch covers a stacked
      # pull request whose base was branched before the file existed. The head
      # copy is a last resort for when neither has it.
      - name: Read settings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          CONFIG="$RUNNER_TEMP/diffloupe.json"
          git show "$BASE_SHA:.github/diffloupe.json" > "$CONFIG" 2>/dev/null ||
            git show "origin/$DEFAULT_BRANCH:.github/diffloupe.json" > "$CONFIG" 2>/dev/null ||
            cp .github/diffloupe.json "$CONFIG"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Pinned: the runner's command line and the prompts' tool guidance are
      # written against these versions. `opencode-ai` on npm is the 1.x line.
      - run: npm install -g --no-fund --no-audit @opencode/cli@2.0.32 "@acemarke/diffloupe@$DIFFLOUPE_VERSION"

      # tilth is built from crates.io: its npm package only downloads a binary
      # from the project's GitHub releases, and that repository is gone.
      - name: Restore tilth
        id: tilth
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tilth/bin
          key: tilth-${{ env.TILTH_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tilth
        if: steps.tilth.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: cargo install tilth --version "$TILTH_VERSION" --locked --root "$RUNNER_TEMP/tilth"

      # Saved here, not at the end of the job: the binary is cached before the
      # model runs, so nothing the review does can end up in the cache.
      - name: Save tilth
        if: steps.tilth.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tilth/bin
          key: ${{ steps.tilth.outputs.cache-primary-key }}

      - name: Add tilth to PATH
        run: |
          echo "$RUNNER_TEMP/tilth/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tilth/bin/tilth" --version

      - name: Doctor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: diffloupe doctor --strict --config "$CONFIG"

      # Default models: Opus for the review and coordinator, Sonnet for the
      # rest. Exit codes: 0 reviewed or skipped, 1 run failed, 2 could not start,
      # 4 skipped by --max-rounds, which the post job still posts a notice for.
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=0
          diffloupe review "#$PR" --headless --github --head "$HEAD_SHA" \
            --config "$CONFIG" --out "$OUT" --max-cost 10 --max-rounds 5 || code=$?
          [ "$code" -eq 4 ] && exit 0
          exit "$code"

      - name: Read result
        id: result
        if: always()
        run: |
          set -euo pipefail
          # Absent when the run could not start (exit 2).
          [ -f "$OUT/result.json" ] || exit 0
          echo "reviewed=$(jq -r '.reviewed' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          echo "skip-reason=$(jq -r '.skipReason // empty' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          echo "artifact=$(jq -r '.artifactName // empty' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          jq -r '"**\(.status)** — \(.findings.posted) finding(s), $\(.costUsd * 100 | round / 100), \(.wallMs / 1000 | round)s, round \(.round)"' \
            "$OUT/result.json" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$OUT/findings.md" ]; then
            { echo; cat "$OUT/findings.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary comment links here for the walkthrough and the evidence
      # behind each finding, so this retention is how long that link works.
      - name: Upload review
        id: upload
        if: always() && steps.result.outputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.result.outputs.artifact }}
          path: ${{ runner.temp }}/diffloupe-out/
          retention-days: 90

  post:
    needs: review
    if: >-
      needs.review.outputs.reviewed == 'true' ||
      needs.review.outputs.skip-reason == 'round-limit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write scope, and it runs no model. It sends the payload
    # file the review job produced, to the pull request named by the event.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The posting script runs from the DiffLoupe source at the same version,
      # not from anything the pull request can change. It imports only node
      # builtins and its own modules, so it needs no install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: markerikson/diffloupe
          ref: v${{ env.DIFFLOUPE_VERSION }}
          path: diffloupe
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.review.outputs.artifact }}
          path: review

      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ needs.review.outputs.artifact_url }}
          DRY_RUN: "0"
        run: bun diffloupe/src/review/post.ts review/payloads.json

      # The labels endpoint creates the label if the repository lacks it.
      - name: Label PRs past the round limit
        # Also after a failed post, so the gate still passes the PR.
        if: ${{ !cancelled() && needs.review.outputs.skip-reason == 'round-limit' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=ai-review-max-rounds'

  gate:
    needs: [review, post]
    # Runs after a review whether or not the post job ran or failed: it reads
    # the PR itself, so findings that did get posted, and earlier rounds'
    # findings, still count. It also runs when the review job fails, so a
    # failed review of a later push does not clear earlier rounds' open
    # findings. It is skipped only when the review job is (drafts, bots,
    # forks), and GitHub counts a skipped required check as passing.
    if: >-
      !cancelled() &&
      (needs.review.result == 'success' || needs.review.result == 'failure') &&
      needs.post.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: npm install -g --no-fund --no-audit "@acemarke/diffloupe@$DIFFLOUPE_VERSION"

      # Exits 3 while an open finding is a blocker. A PR past --max-rounds has
      # the label and passes.
      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # This push's review never reached the PR. The gate then fails if no
          # earlier review did either, so a broken first review cannot merge
          # unreviewed; otherwise it judges what earlier reviews left open.
          REVIEW_MISSING: >-
            ${{ (needs.review.result == 'failure' ||
            (needs.review.outputs.reviewed == 'true' && needs.post.result == 'failure')) && 'yes' || '' }}
        run: >-
          diffloupe gate "$GITHUB_REPOSITORY#$PR"
          --fail-on blocker
          --override-label ai-review-max-rounds
          --status "$HEAD_SHA"
          ${REVIEW_MISSING:+--review-missing}
